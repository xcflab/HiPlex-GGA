[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hiplex-gga"
version = "0.1.0"
description = "HiPlex-GGA: a hierarchical multiplexed Golden Gate assembly strategy that converts chip-synthesized oligo pools into longer DNA libraries through successive rounds of pooled pairwise assembly."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Zhien Wu" }
]
dependencies = [
  "biopython>=1.80",
  "numpy>=1.23",
  "tqdm>=4.64"
]

[project.optional-dependencies]
test = [
  "pytest>=7"
]

[project.scripts]
hiplex-gga = "oligos_gg_assembly.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oligos_gg_assembly = ["data/*.tab"]

